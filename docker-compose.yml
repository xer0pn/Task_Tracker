services:
  api:
    build:
      context: ./backend
      dockerfile: TaskTracker.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Data Source=/app/data/tasktracker.db
    ports:
      - "5172:8080"
    volumes:
      - tasktracker-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  tasktracker-data:
